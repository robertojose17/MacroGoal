name: TDEE dashboard and browser checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tdee-browser-journal.yml'
      - 'tests/browser-journal/**'
      - 'tests/browser-visual/**'
      - 'components/DashboardStatInfo.tsx'
      - 'utils/*Journal*.ts'
      - 'utils/browserEncryptedJournalStorage.ts'
      - 'hooks/useAcceptedGoalEditor.ts'
      - 'hooks/useInitialOnboarding.ts'
      - 'app/settings.tsx'
      - 'app/edit-goals.tsx'
      - 'tests/settings-goal-navigation.test.cjs'
      - 'tests/edit-goals-feedback.test.cjs'
      - 'components/GoalWeightCard.tsx'
      - 'components/ProgressCard.tsx'
      - 'components/ObservedActivityCard.tsx'
      - 'components/Tdee*'
      - 'app/(tabs)/dashboard.tsx'
      - 'app/(tabs)/(home)/index.web.tsx'
      - 'app/settings.*.tsx'
      - 'hooks/useTdeeDashboardAttention.ts'
      - 'hooks/useProgressIntelligence.ts'
      - 'utils/foodsReadScope.ts'
      - 'utils/automaticBurnExplanation.ts'
      - 'utils/tdeeDashboardAttention.ts'
      - 'utils/rules14DashboardPolicy.ts'
      - 'utils/dynamicTdeeObservation.ts'
      - 'release-candidates/tdee-adaptive-review/**'
      - 'supabase/functions/observed-snapshot-release/**'
      - 'supabase/functions/ai-coach-daily/**'
      - 'tests/dashboard-*.test.*'
      - 'tests/dashboard616-refinement.test.mjs'
      - 'utils/dashboardArrivalEstimate.ts'
      - 'utils/dashboardBurnStatus.ts'
      - 'tests/automatic-scheduler.test.mjs'
      - 'tests/foods-web-accepted-goal.test.cjs'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tdee-browser-journal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.0'
      - name: Install only locked isolated browser test tooling
        working-directory: tests/browser-journal
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium and system dependencies
        working-directory: tests/browser-journal
        run: npx --no-install playwright install --with-deps chromium
      - name: Check harness syntax
        working-directory: tests/browser-journal
        run: npm run check
      - name: Goal navigation and verified save feedback
        run: NODE_PATH="$PWD/tests/browser-journal/node_modules" node --test tests/settings-goal-navigation.test.cjs tests/edit-goals-feedback.test.cjs
      - name: Dashboard, automatic analysis, scheduler and Foods regressions
        run: >-
          NODE_PATH="$PWD/tests/browser-journal/node_modules" node --test
          tests/accepted-intake-rate-anchor-loader-source.test.mjs
          tests/accepted-intake-rate-anchor.test.mjs
          tests/automatic-scheduler.test.mjs
          tests/dashboard-attention-client.test.mjs
          tests/dashboard-automatic-analysis.test.mjs
          tests/dashboard-journey.test.cjs
          tests/dashboard-visual-contract.test.mjs
          tests/dashboard-review-action-contract.test.mjs
          tests/dashboard616-refinement.test.mjs
          tests/dashboard-arrival-estimate.test.cjs
          tests/dashboard-pending-recovery.test.mjs
          tests/foods-web-accepted-goal.test.cjs
          tests/rate-anchor-append-source.test.mjs
          tests/rate-anchor-bootstrap.test.mjs
          tests/rate-anchor-erasure-source.test.mjs
          tests/rate-anchor-persistence-plan.test.mjs
          tests/rules-screening-controller.test.mjs
          tests/rules14-activation-on.test.mjs
          tests/rules14-anchor-integration.test.mjs
          tests/rules14-anchor-reconciliation.test.mjs
          tests/rules14-chain-dual-sql-source.test.mjs
          tests/rules14-chain.test.mjs
          tests/rules14-diagnostic-release-hide.test.mjs
          tests/rules14-diagnostic.test.mjs
          tests/rules14-frozen-history.test.mjs
          tests/rules14-full.test.mjs
          tests/rules14-goal-date.test.mjs
          tests/rules14-hold-http.test.mjs
          tests/rules14-hold-ui.test.mjs
          tests/rules14-issuer-identifiers.test.mjs
          tests/rules14-material-hold.test.mjs
          tests/rules14-observed-runtime.test.mjs
          tests/rules14-policy-expiry.test.mjs
          tests/rules14-release-config.test.mjs
          tests/rules14-screening-telemetry.test.mjs
          tests/rules14-selection-asof.test.mjs
          tests/rules14-ui-controller.test.mjs
          tests/rules14-ui-verified-commit.test.mjs
          tests/rules14-v2-issuer-scope-source.test.mjs
          tests/tdee-access-refresh-unknown-retry.test.mjs
          tests/tdee-observed-coverage-ui.test.mjs
      - name: Actual repository modules in isolated Chromium
        working-directory: tests/browser-journal
        run: npm test
      - name: Emit synthetic JSON evidence even on failure
        if: always()
        working-directory: tests/browser-journal
        run: test ! -f results.json || cat results.json
      - name: Public deployment response diagnostic (no authentication)
        if: always()
        env:
          # Temporary diagnostic target for this deployment; remove env to make this step a no-op.
          DIAGNOSTIC_DEPLOYMENT_URL: 'https://macro-goal--yev0y2o08u.expo.app/'
        run: node tests/browser-journal/public-deployment-diagnostic.mjs


      - name: Install locked visual rendering tooling
        if: ${{ !cancelled() }}
        working-directory: tests/browser-visual
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual styled React Native Web visual checks
        if: ${{ !cancelled() }}
        working-directory: tests/browser-visual
        run: npm run check && npm test
      - name: Upload synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified official tag
        with:
          name: dashboard-visual-${{ github.sha }}
          path: tests/browser-visual/artifacts/
          if-no-files-found: warn
          retention-days: 7


